<div class="top-row">
  <div class="episode">
    Episode: {{ state.episode_number }}
  </div>

  {% if state.collecting -%}
    <div class="status collecting">Collecting</div>
  {% else -%}
    <div class="status idle">Idle</div>
  {% endif -%}
</div>

<div class="arm-row">
  <div class="arm-label">Arm</div>
  <div class="arm-badge {{ state.arm_status_left }}">L: {{ state.arm_status_left | upper }}</div>
  <div class="arm-badge {{ state.arm_status_right }}">R: {{ state.arm_status_right | upper }}</div>
  {% if state.arm_status_right == "stopped" and state.arm_status_left == "stopped" -%}
    <form id="arm-start-form" action="{{ url_for("_arm_start") }}" method="post">
      <input class="big-button start arm-toggle" type="submit" value="Start Arm">
    </form>
  {% else -%}
    <form id="arm-stop-form" action="{{ url_for("_arm_stop") }}" method="post">
      <input class="big-button finish arm-toggle" type="submit" value="Pause Arm">
    </form>
  {% endif -%}
</div>
