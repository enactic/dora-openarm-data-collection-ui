<div class="camera-stats" id="camera-panel" hidden>
  <div class="camera-stats-title">{{ t("cameras") }}</div>
  <div class="stat-row stale" data-cam="camera_wrist_right">
    <span class="cam-name">{{ t("cam_wrist_right") }}</span>
    <span class="cam-fps">-- Hz</span>
    <span class="cam-jitter">Δ -- ms</span>
  </div>
  <div class="stat-row stale" data-cam="camera_wrist_left">
    <span class="cam-name">{{ t("cam_wrist_left") }}</span>
    <span class="cam-fps">-- Hz</span>
    <span class="cam-jitter">Δ -- ms</span>
  </div>
  <div class="stat-row stale" data-cam="camera_head_left">
    <span class="cam-name">{{ t("cam_head_left") }}</span>
    <span class="cam-fps">-- Hz</span>
    <span class="cam-jitter">Δ -- ms</span>
  </div>
  <div class="stat-row stale" data-cam="camera_head_right">
    <span class="cam-name">{{ t("cam_head_right") }}</span>
    <span class="cam-fps">-- Hz</span>
    <span class="cam-jitter">Δ -- ms</span>
  </div>
  <div class="stat-row stale" data-cam="camera_ceiling">
    <span class="cam-name">{{ t("cam_ceiling") }}</span>
    <span class="cam-fps">-- Hz</span>
    <span class="cam-jitter">Δ -- ms</span>
  </div>
</div>

<div class="camera-stats vr-stats" id="ker-panel" hidden>
  <div class="camera-stats-title">
    {{ t("leader_stream") }}<span class="device-name"></span>
  </div>
  <div class="stat-row stale" data-ker="ker_rx">
    <span class="cam-name">KER</span>
    <span class="cam-fps">-- Hz</span>
    <span class="cam-jitter">&Delta; -- ms</span>
  </div>
</div>

<div class="camera-stats vr-stats" id="vr-panel" hidden>
  <div class="camera-stats-title">{{ t("vr_stream") }}</div>
  <div class="stat-row stale" data-vr="vr_rx">
    <span class="cam-name">VR</span>
    <span class="cam-fps">-- Hz</span>
    <span class="cam-jitter">Δ -- ms</span>
  </div>
</div>
