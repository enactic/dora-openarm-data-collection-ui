<div class="camera-stats arm-temps" id="arm-health-panel" hidden>
  <div class="camera-stats-title">Motor temperatures</div>
  <div class="temp-sides">
    {% for side in ["left", "right"] -%}
    <div class="temp-side" data-arm="{{ side }}">
      <div class="temp-side-title">
        {{ side | upper }}<span class="bus-badge">BUS --</span>
      </div>
      <div class="temp-head">
        <span>joint</span><span>MOS</span><span>rotor</span><span>status</span>
      </div>
      <div class="temp-rows"></div>
    </div>
    {% endfor -%}
  </div>
</div>
