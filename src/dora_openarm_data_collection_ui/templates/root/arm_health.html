<div class="camera-stats arm-temps" id="arm-health-panel" hidden>
  <div class="camera-stats-title">{{ t("motor_temperatures") }}</div>
  <div class="temp-sides">
    {% for side in ["left", "right"] -%}
    <div class="temp-side" data-arm="{{ side }}">
      <div class="temp-side-title">
        {{ t("arm_" + side) }}<span class="bus-badge">BUS --</span>
      </div>
      <div class="temp-head">
        <span>{{ t("joint") }}</span><span>MOS</span><span>{{ t("rotor") }}</span><span>{{ t("motor_state") }}</span>
      </div>
      <div class="temp-rows"></div>
    </div>
    {% endfor -%}
  </div>
</div>
